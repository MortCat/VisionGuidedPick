move_group:
  robot_description_kinematics: &id001
    panda_arm:
      kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
      kinematics_solver_search_resolution: 0.005
      kinematics_solver_timeout: 0.05
  planning_pipelines:
  - ompl
  default_planning_pipeline: ompl
  pilz_industrial_motion_planner:
    planning_plugins:
    - pilz_industrial_motion_planner/CommandPlanner
    request_adapters:
    - default_planning_request_adapters/ValidateWorkspaceBounds
    - default_planning_request_adapters/CheckStartStateBounds
    - default_planning_request_adapters/CheckStartStateCollision
    default_planner_config: PTP
    capabilities: pilz_industrial_motion_planner/MoveGroupSequenceAction pilz_industrial_motion_planner/MoveGroupSequenceService
  ompl:
    planning_plugins:
    - ompl_interface/OMPLPlanner
    request_adapters:
    - default_planning_request_adapters/ResolveConstraintFrames
    - default_planning_request_adapters/ValidateWorkspaceBounds
    - default_planning_request_adapters/CheckStartStateBounds
    - default_planning_request_adapters/CheckStartStateCollision
    response_adapters:
    - default_planning_response_adapters/AddTimeOptimalParameterization
    - default_planning_response_adapters/ValidateSolution
    - default_planning_response_adapters/DisplayMotionPath
    planner_configs:
      APSConfigDefault:
        type: geometric::AnytimePathShortening
        shortcut: 1
        hybridize: 1
        max_hybrid_paths: 36
        num_planners: 8
        planners: RRTConnect,RRTConnect,RRTConnect,RRTConnect,RRTConnect,RRTConnect,RRTConnect,RRTConnect
      SBLkConfigDefault:
        type: geometric::SBL
        range: 0.0
      ESTkConfigDefault:
        type: geometric::EST
        range: 0.0
        goal_bias: 0.05
      LBKPIECEkConfigDefault:
        type: geometric::LBKPIECE
        range: 0.0
        border_fraction: 0.9
        min_valid_path_fraction: 0.5
      BKPIECEkConfigDefault:
        type: geometric::BKPIECE
        range: 0.0
        border_fraction: 0.9
        failed_expansion_score_factor: 0.5
        min_valid_path_fraction: 0.5
      KPIECEkConfigDefault:
        type: geometric::KPIECE
        range: 0.0
        goal_bias: 0.05
        border_fraction: 0.9
        failed_expansion_score_factor: 0.5
        min_valid_path_fraction: 0.5
      RRTkConfigDefault:
        type: geometric::RRT
        range: 0.0
        goal_bias: 0.05
      RRTConnectkConfigDefault:
        type: geometric::RRTConnect
        range: 0.0
      RRTstarkConfigDefault:
        type: geometric::RRTstar
        range: 0.0
        goal_bias: 0.05
        delay_collision_checking: 1
      TRRTkConfigDefault:
        type: geometric::TRRT
        range: 0.0
        goal_bias: 0.05
        max_states_failed: 10
        temp_change_factor: 2.0
        min_temperature: 10e-10
        init_temperature: 10e-6
        frountier_threshold: 0.0
        frountierNodeRatio: 0.1
        k_constant: 0.0
      PRMkConfigDefault:
        type: geometric::PRM
        max_nearest_neighbors: 10
      PRMstarkConfigDefault:
        type: geometric::PRMstar
      FMTkConfigDefault:
        type: geometric::FMT
        num_samples: 1000
        radius_multiplier: 1.1
        nearest_k: 1
        cache_cc: 1
        heuristics: 0
        extended_fmt: 1
      BFMTkConfigDefault:
        type: geometric::BFMT
        num_samples: 1000
        radius_multiplier: 1.0
        nearest_k: 1
        balanced: 0
        optimality: 1
        heuristics: 1
        cache_cc: 1
        extended_fmt: 1
      PDSTkConfigDefault:
        type: geometric::PDST
      STRIDEkConfigDefault:
        type: geometric::STRIDE
        range: 0.0
        goal_bias: 0.05
        use_projected_distance: 0
        degree: 16
        max_degree: 18
        min_degree: 12
        max_pts_per_leaf: 6
        estimated_dimension: 0.0
        min_valid_path_fraction: 0.2
      BiTRRTkConfigDefault:
        type: geometric::BiTRRT
        range: 0.0
        temp_change_factor: 0.1
        init_temperature: 100
        frountier_threshold: 0.0
        frountier_node_ratio: 0.1
        cost_threshold: 1e300
      LBTRRTkConfigDefault:
        type: geometric::LBTRRT
        range: 0.0
        goal_bias: 0.05
        epsilon: 0.4
      BiESTkConfigDefault:
        type: geometric::BiEST
        range: 0.0
      ProjESTkConfigDefault:
        type: geometric::ProjEST
        range: 0.0
        goal_bias: 0.05
      LazyPRMkConfigDefault:
        type: geometric::LazyPRM
        range: 0.0
      LazyPRMstarkConfigDefault:
        type: geometric::LazyPRMstar
      SPARSkConfigDefault:
        type: geometric::SPARS
        stretch_factor: 3.0
        sparse_delta_fraction: 0.25
        dense_delta_fraction: 0.001
        max_failures: 1000
      SPARStwokConfigDefault:
        type: geometric::SPARStwo
        stretch_factor: 3.0
        sparse_delta_fraction: 0.25
        dense_delta_fraction: 0.001
        max_failures: 5000
      TrajOptDefault:
        type: geometric::TrajOpt
    panda_arm:
      planner_configs:
      - APSConfigDefault
      - SBLkConfigDefault
      - ESTkConfigDefault
      - LBKPIECEkConfigDefault
      - BKPIECEkConfigDefault
      - KPIECEkConfigDefault
      - RRTkConfigDefault
      - RRTConnectkConfigDefault
      - RRTstarkConfigDefault
      - TRRTkConfigDefault
      - PRMkConfigDefault
      - PRMstarkConfigDefault
      - FMTkConfigDefault
      - BFMTkConfigDefault
      - PDSTkConfigDefault
      - STRIDEkConfigDefault
      - BiTRRTkConfigDefault
      - LBTRRTkConfigDefault
      - BiESTkConfigDefault
      - ProjESTkConfigDefault
      - LazyPRMkConfigDefault
      - LazyPRMstarkConfigDefault
      - SPARSkConfigDefault
      - SPARStwokConfigDefault
      - TrajOptDefault
    panda_arm_hand:
      planner_configs:
      - APSConfigDefault
      - SBLkConfigDefault
      - ESTkConfigDefault
      - LBKPIECEkConfigDefault
      - BKPIECEkConfigDefault
      - KPIECEkConfigDefault
      - RRTkConfigDefault
      - RRTConnectkConfigDefault
      - RRTstarkConfigDefault
      - TRRTkConfigDefault
      - PRMkConfigDefault
      - PRMstarkConfigDefault
      - FMTkConfigDefault
      - BFMTkConfigDefault
      - PDSTkConfigDefault
      - STRIDEkConfigDefault
      - BiTRRTkConfigDefault
      - LBTRRTkConfigDefault
      - BiESTkConfigDefault
      - ProjESTkConfigDefault
      - LazyPRMkConfigDefault
      - LazyPRMstarkConfigDefault
      - SPARSkConfigDefault
      - SPARStwokConfigDefault
      - TrajOptDefault
    hand:
      planner_configs:
      - APSConfigDefault
      - SBLkConfigDefault
      - ESTkConfigDefault
      - LBKPIECEkConfigDefault
      - BKPIECEkConfigDefault
      - KPIECEkConfigDefault
      - RRTkConfigDefault
      - RRTConnectkConfigDefault
      - RRTstarkConfigDefault
      - TRRTkConfigDefault
      - PRMkConfigDefault
      - PRMstarkConfigDefault
      - FMTkConfigDefault
      - BFMTkConfigDefault
      - PDSTkConfigDefault
      - STRIDEkConfigDefault
      - BiTRRTkConfigDefault
      - LBTRRTkConfigDefault
      - BiESTkConfigDefault
      - ProjESTkConfigDefault
      - LazyPRMkConfigDefault
      - LazyPRMstarkConfigDefault
      - SPARSkConfigDefault
      - SPARStwokConfigDefault
      - TrajOptDefault
  chomp:
    planning_plugins:
    - chomp_interface/CHOMPPlanner
    request_adapters:
    - default_planning_request_adapters/ResolveConstraintFrames
    - default_planning_request_adapters/ValidateWorkspaceBounds
    - default_planning_request_adapters/CheckStartStateBounds
    - default_planning_request_adapters/CheckStartStateCollision
    response_adapters:
    - default_planning_response_adapters/AddTimeOptimalParameterization
    planning_time_limit: 10.0
    max_iterations: 200
    max_iterations_after_collision_free: 5
    smoothness_cost_weight: 0.1
    obstacle_cost_weight: 1.0
    learning_rate: 0.01
    animate_path: true
    add_randomness: false
    smoothness_cost_velocity: 0.0
    smoothness_cost_acceleration: 1.0
    smoothness_cost_jerk: 0.0
    hmc_discretization: 0.01
    hmc_stochasticity: 0.01
    hmc_annealing_factor: 0.99
    use_hamiltonian_monte_carlo: false
    ridge_factor: 0.0
    use_pseudo_inverse: false
    pseudo_inverse_ridge_factor: 1e-4
    animate_endeffector: false
    animate_endeffector_segment: panda_rightfinger
    joint_update_limit: 0.1
    collision_clearance: 0.2
    collision_threshold: 0.07
    random_jump_amount: 1.0
    use_stochastic_descent: true
    enable_failure_recovery: false
    max_recovery_attempts: 5
    trajectory_initialization_method: quintic-spline
  stomp:
    planning_plugins:
    - stomp_moveit/StompPlanner
    request_adapters:
    - default_planning_request_adapters/ResolveConstraintFrames
    - default_planning_request_adapters/ValidateWorkspaceBounds
    - default_planning_request_adapters/CheckStartStateBounds
    - default_planning_request_adapters/CheckStartStateCollision
    response_adapters:
    - default_planning_response_adapters/AddTimeOptimalParameterization
    - default_planning_response_adapters/ValidateSolution
    - default_planning_response_adapters/DisplayMotionPath
    stomp_moveit:
      num_timesteps: 60
      num_iterations: 40
      num_iterations_after_valid: 0
      num_rollouts: 30
      max_rollouts: 30
      exponentiated_cost_sensitivity: 0.5
      control_cost_weight: 0.1
      delta_t: 0.1
  moveit_manage_controllers: true
  trajectory_execution:
    allowed_execution_duration_scaling: 1.2
    allowed_goal_duration_margin: 0.5
    allowed_start_tolerance: 0.01
    execution_duration_monitoring: true
  moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager
  moveit_simple_controller_manager:
    controller_names:
    - arm_controller
    arm_controller:
      type: FollowJointTrajectory
      action_ns: follow_joint_trajectory
      default: true
      joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
  publish_planning_scene: true
  publish_geometry_updates: true
  publish_state_updates: true
  publish_transforms_updates: true
  publish_robot_description: false
  publish_robot_description_semantic: false
  robot_description_planning: &id002
    joint_limits:
      panda_joint1:
        has_velocity_limits: true
        max_velocity: 2.175
        has_acceleration_limits: true
        max_acceleration: 3.75
        has_jerk_limits: true
        max_jerk: 300.0
      panda_joint2:
        has_velocity_limits: true
        max_velocity: 2.175
        has_acceleration_limits: true
        max_acceleration: 1.875
        has_jerk_limits: true
        max_jerk: 300.0
      panda_joint3:
        has_velocity_limits: true
        max_velocity: 2.175
        has_acceleration_limits: true
        max_acceleration: 2.5
        has_jerk_limits: true
        max_jerk: 300.0
      panda_joint4:
        has_velocity_limits: true
        max_velocity: 2.175
        has_acceleration_limits: true
        max_acceleration: 3.125
        has_jerk_limits: true
        max_jerk: 300.0
      panda_joint5:
        has_velocity_limits: true
        max_velocity: 2.61
        has_acceleration_limits: true
        max_acceleration: 3.75
        has_jerk_limits: true
        max_jerk: 300.0
      panda_joint6:
        has_velocity_limits: true
        max_velocity: 2.61
        has_acceleration_limits: true
        max_acceleration: 5.0
        has_jerk_limits: true
        max_jerk: 300.0
      panda_joint7:
        has_velocity_limits: true
        max_velocity: 2.61
        has_acceleration_limits: true
        max_acceleration: 5.0
        has_jerk_limits: true
        max_jerk: 300.0
      panda_finger_joint1:
        has_velocity_limits: true
        max_velocity: 0.1
        has_acceleration_limits: true
        max_acceleration: 1.0
        has_jerk_limits: true
        max_jerk: 300.0
      panda_finger_joint2:
        has_velocity_limits: true
        max_velocity: 0.1
        has_acceleration_limits: true
        max_acceleration: 1.0
        has_jerk_limits: true
        max_jerk: 300.0
    cartesian_limits:
      max_trans_vel: 1.0
      max_trans_acc: 2.25
      max_trans_dec: -5.0
      max_rot_vel: 1.57
  use_sim_time: true
servo:
  moveit_servo:
    publish_period: 0.025
    max_expected_latency: 0.1
    command_in_type: speed_units
    scale:
      linear: 0.2
      rotational: 0.8
      joint: 0.5
    command_out_type: trajectory_msgs/JointTrajectory
    publish_joint_positions: true
    publish_joint_velocities: true
    publish_joint_accelerations: false
    use_smoothing: true
    smoothing_filter_plugin_name: online_signal_smoothing::AccelerationLimitedPlugin
    is_primary_planning_scene_monitor: false
    check_octomap_collisions: false
    move_group_name: panda_arm
    lower_singularity_threshold: 10.0
    hard_stop_singularity_threshold: 30.0
    leaving_singularity_threshold_multiplier: 2.0
    joint_limit_margins:
    - 0.12
    cartesian_command_in_topic: servo/twist_command
    joint_command_in_topic: ~/delta_joint_cmds
    joint_topic: joint_states
    status_topic: servo/status
    command_out_topic: servo/joint_trajectory
    check_collisions: true
    collision_check_rate: 20.0
    self_collision_proximity_threshold: 0.01
    scene_collision_proximity_threshold: 0.01
    monitored_planning_scene_topic: monitored_planning_scene
    pose_command_in_topic: servo/pose_target
    incoming_command_timeout: 0.25
gateway:
  robot_description_kinematics: *id001
  robot_description_planning: *id002
