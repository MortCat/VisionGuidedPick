  max_velocity_scale: 0.5
  max_acceleration_scale: 0.5
  position_tolerance_m: 0.01
  orientation_tolerance_rad: 0.05
  max_follow_linear_speed_mps: 1
  max_follow_angular_speed_radps: 1
  workspace: {bounds_min_m: [-2, -2, -2], bounds_max_m: [2, 2, 2]}
  observation_pose: {position_m: [0, 0, 0], orientation_xyzw: [0, 0, 0, 1]}
