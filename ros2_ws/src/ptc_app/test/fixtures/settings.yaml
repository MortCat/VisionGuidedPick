# SYNTHETIC LOGIC TEST FIXTURE. Not a deployable robot/model configuration.
schema_version: 1
configuration_state: ready
runtime: {namespace: cell_1, use_sim_time: true, motion_backend: mock}
frames: {world: world, robot_base: base, tcp: tcp, color_optical: rgb_optical, depth_optical: depth_optical}
calibration: {robot_description_path: synthetic_robot.urdf, expected_calibration_id: synthetic_calibration}
time: {sensor_future_tolerance_sec: 0.01}
vision: {rgb_depth_sync_tolerance_sec: 0.01, frame_max_age_sec: 0.5, tf_lookup_timeout_sec: 0.1, max_buffered_frames: 4, roi_margin_ratio: 0.1, depth_min_m: 0.1, depth_max_m: 5, depth_registration: required}
tracking: {min_confirmed_observations: 2, observation_max_age_sec: 0.5, temporary_loss_timeout_sec: 1, max_prediction_horizon_sec: 0.2, association_distance_m: 0.5, max_position_stddev_m: 0.05, max_tracked_objects: 8, velocity_min_samples: 3, velocity_max_samples: 8, velocity_window_sec: 0.5, velocity_min_span_sec: 0.25, max_velocity_fit_residual_m: 0.02, max_velocity_uncertainty_mps: 0.08}
task: {cycle_timeout_sec: 100, preparing_pick_timeout_sec: 10, transport_timeout_sec: 10, place_timeout_sec: 10, recovery_timeout_sec: 5, max_cycle_retries: 1, candidate_retry_interval_sec: 0.75, max_candidate_admission_attempts_per_observation: 2}
inspection:
